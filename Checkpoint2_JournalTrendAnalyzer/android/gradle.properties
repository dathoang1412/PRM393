org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler crashes on Windows when the project (D:) and
# the pub cache (C:) live on different drive roots — Path.relativize() can't
# compute a relative path across roots, so it throws "different roots" and
# fails the whole Gradle daemon. Disabling incremental compilation avoids
# that relativize call entirely; only costs a slightly slower first build.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
