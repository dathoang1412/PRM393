name: journexa
description: A Flutter app for analyzing academic publication trends with OpenAlex.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  firebase_analytics: ^11.3.3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3
  firebase_storage: ^12.3.2
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  http: ^1.2.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  provider: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0
  image: ^4.1.7
  patrol: ^3.13.0

# Patrol E2E test runner configuration (see integration_test/).
patrol:
  app_name: Journexa
  android:
    package_name: com.example.journal_trend_analyzer

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F5D4E"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
